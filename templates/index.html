<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --bot-bubble: #f1f5f9;
  }

  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 60%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text);
  }

  .chat-window {
    width: 100%;
    max-width: 680px;
    height: min(720px, 92vh);
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(15, 23, 42, 0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--primary), #2563eb);
    color: #fff;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .header h1 { font-size: 1.05rem; font-weight: 600; }
  .status { font-size: 0.8rem; opacity: 0.9; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .status::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: #4ade80; display: inline-block;
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .msg { display: flex; flex-direction: column; max-width: 80%; animation: fadeUp 0.25s ease; }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; align-items: flex-end; }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 0.95rem;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--primary), #2563eb);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .meta { font-size: 0.72rem; color: var(--muted); margin-top: 4px; padding: 0 4px; }

  .error-bubble .bubble { background: #fef2f2; color: #b91c1c; }

  /* Typing indicator */
  .typing { display: none; align-self: flex-start; }
  .typing .bubble { display: flex; gap: 5px; padding: 14px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #94a3b8;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  /* Suggestions */
  .suggestions {
    padding: 0 22px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    background: #eef2ff;
    color: var(--primary-dark);
    border: 1px solid #c7d2fe;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .chip:hover { background: #e0e7ff; }

  /* Input */
  .input-area {
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--card);
  }
  .input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-area input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }
  .send-btn {
    width: 46px; height: 46px;
    border: none;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: var(--primary-dark); transform: scale(1.05); }
  .send-btn:disabled { background: #a5b4fc; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 20px; height: 20px; fill: currentColor; }

  footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    padding: 0 0 10px;
  }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  @media (max-width: 560px) {
    body { padding: 0; }
    .chat-window { height: 100vh; border-radius: 0; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>
<div class="chat-window">

  <div class="header">
    <div class="avatar">💬</div>
    <div>
      <h1>Customer Support Assistant</h1>
      <div class="status">Online · Usually replies instantly</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="bubble">Hello! I'm here to help with orders, refunds, payments and account questions. What can I do for you today?</div>
      <div class="meta" id="welcomeTime"></div>
    </div>
    <div class="msg typing" id="typing">
      <div class="bubble"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="suggestions" id="suggestions">
    <button class="chip" data-q="What are your working hours?">Working hours</button>
    <button class="chip" data-q="How can I reset my password?">Reset password</button>
    <button class="chip" data-q="Do you offer refunds?">Refunds</button>
    <button class="chip" data-q="How do I track my order?">Track order</button>
  </div>

  <form class="input-area" id="chatForm">
    <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off" maxlength="500">
    <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </form>

  <footer>Answers are based on our FAQ. For other issues, contact support.</footer>
</div>

<script>
const messagesEl = document.getElementById("messages");
const typingEl = document.getElementById("typing");
const form = document.getElementById("chatForm");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const suggestionsEl = document.getElementById("suggestions");

// Keep one session ID per browser so the bot remembers the conversation
let sessionId = localStorage.getItem("chat_session_id");
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem("chat_session_id", sessionId);
}

function timeNow() {
  return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

document.getElementById("welcomeTime").textContent = timeNow();

function addMessage(text, who, extraClass = "") {
  const wrap = document.createElement("div");
  wrap.className = "msg " + who + " " + extraClass;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;            // textContent keeps user input safe

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = timeNow();

  wrap.appendChild(bubble);
  wrap.appendChild(meta);
  messagesEl.insertBefore(wrap, typingEl);
  scrollToBottom();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  input.disabled = busy;
  typingEl.style.display = busy ? "flex" : "none";
  if (busy) scrollToBottom();
}

async function sendMessage(text) {
  text = text.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  suggestionsEl.style.display = "none";
  setBusy(true);

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    addMessage(data.reply, "bot");
  } catch (err) {
    addMessage("Sorry, something went wrong. Please try again in a moment.", "bot", "error-bubble");
  } finally {
    setBusy(false);
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  sendMessage(input.value);
});

suggestionsEl.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (chip) sendMessage(chip.dataset.q);
});

input.focus();
</script>
</body>
</html>
